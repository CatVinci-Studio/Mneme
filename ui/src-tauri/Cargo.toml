[package]
name = "mneme"
version = "0.2.0"
description = "A local-first read-it-later app that grows an AI-maintained Markdown wiki"
authors = ["CatVinci Studio"]
license = "MIT"
repository = "https://github.com/CatVinci-Studio/Mneme"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mneme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
once_cell = "1"
scraper = "0.24"
url = "2"
pdf-extract = "0.12"
thiserror = "2"
tempfile = "3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
